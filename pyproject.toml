[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "worldline-social"
version = "0.1.0"
description = "A clear, replayable social simulation built on Worldline Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "worldline-engine @ git+https://github.com/Lecheeel/worldline-engine.git@a20ceab",
]

[project.optional-dependencies]
vector = ["sqlite-vec>=0.1.9,<0.2"]
embedding = ["sentence-transformers>=3.0,<4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/worldline_social"]

[tool.hatch.metadata]
allow-direct-references = true
